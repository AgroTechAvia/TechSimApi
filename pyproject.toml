[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrotechsimapi"
version = "1.1.0"
authors = [
  { name="AgroTechAvia" },
]
description = "Python API and calibrated autonomous flight control for AgroTechSim"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["AgroTechSim", "simulator", "drone", "robotics", "PID"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "backports.ssl-match-hostname",
    "contourpy",
    "cycler",
    "fonttools",
    "Flask>=3.0,<4",
    "future",
    "grpcio",
    "grpcio-tools",
    "iso8601",
    "kiwisolver",
    "matplotlib",
    "msgpack-python",
    "msgpack-rpc-python",
    "numpy",
    "opencv-contrib-python",
    "opencv-python",
    "packaging",
    "pillow",
    "protobuf",
    "pynput",
    "pyparsing",
    "python-dateutil",
    "PyYAML",
    "pyserial",
    "six",
    "tornado",
    "transforms3d",
    "inavmspapi",
]

[project.urls]
Homepage = "https://github.com/AgroTechAvia/TechSimApi"
Repository = "https://github.com/AgroTechAvia/TechSimApi"
Documentation = "https://github.com/AgroTechAvia/TechSimApi/tree/main/docs"
Issues = "https://github.com/AgroTechAvia/TechSimApi/issues"

[project.scripts]
agrotechsimapi = "agrotechsimapi.__main__:main"

[tool.setuptools.packages.find]
include = ["agrotechsimapi*", "modules*"]

[tool.setuptools.package-data]
"agrotechsimapi.calibration" = ["data/*.json", "data/*.gz", "assets/*.css", "assets/*.js"]
